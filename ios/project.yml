name: CutOut
options:
  bundleIdPrefix: com.zpresso
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: G6J9BUHSNH
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  CutOut:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CutOut
      # blue folder reference: the whole web app is copied into the bundle as-is,
      # so index.html keeps its relative paths to sw.js / the icons
      - path: Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zpresso.cutout
        PRODUCT_NAME: CutOut
        INFOPLIST_FILE: CutOut/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
      # Debug signs itself for the simulator. Release is signed against the App Store
      # profile created through the App Store Connect API — this account's key is not
      # permitted to do Xcode cloud signing, so the profile is managed explicitly.
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "CutOut App Store"

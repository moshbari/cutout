name: CutOut
options:
  bundleIdPrefix: com.zpresso
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "7"
    DEVELOPMENT_TEAM: G6J9BUHSNH
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  CutOut:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CutOut
      - path: Shared
      # blue folder reference: the whole web app is copied into the bundle as-is,
      # so index.html keeps its relative paths to sw.js / the icons
      - path: Web
        type: folder
        buildPhase: resources
    dependencies:
      - target: CutOutShare
    entitlements:
      path: CutOut/CutOut.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zpresso.cutout]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zpresso.cutout
        PRODUCT_NAME: CutOut
        INFOPLIST_FILE: CutOut/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
      # Debug signs itself for the simulator. Release is signed against the App Store
      # profile created through the App Store Connect API — this account's key is not
      # permitted to do Xcode cloud signing, so the profile is managed explicitly.
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "CutOut App Store"

  # "Share → CutOut" from Photos, Files, Mail… — hands the file to the app
  # through the shared App Group folder, then opens the app.
  CutOutShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CutOutShare
      - path: Shared
    entitlements:
      path: CutOutShare/CutOutShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zpresso.cutout]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zpresso.cutout.share
        PRODUCT_NAME: CutOutShare
        INFOPLIST_FILE: CutOutShare/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "CutOut Share App Store"
